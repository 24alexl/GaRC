<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GaRC — Guided Cybersecurity & NIST SP 800-171 Compliance</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/cytoscape/3.28.1/cytoscape.min.js"></script>
  <!-- Dagre Hierarchical Layout Engine for Untangled Graphs -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/dagre/0.8.5/dagre.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/cytoscape-dagre@2.5.0/cytoscape-dagre.min.js"></script>
  <!-- Marked Markdown Parser -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛡️</text></svg>">
  <style>
    html, body { height: 100%; overflow: hidden; font-family: 'Inter', sans-serif; background-color: #080c14; color: #f1f5f9; }
    code, pre { font-family: 'JetBrains Mono', monospace; }
    .glass-card { background: rgba(15, 23, 42, 0.88); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.08); }
    .glass-card-hover:hover { border-color: rgba(6, 182, 212, 0.4); }
    .custom-scroll::-webkit-scrollbar { width: 5px; height: 5px; }
    .custom-scroll::-webkit-scrollbar-track { background: rgba(15, 23, 42, 0.4); }
    .custom-scroll::-webkit-scrollbar-thumb { background: rgba(71, 85, 105, 0.6); border-radius: 4px; }
    
    /* Rich Markdown Prose */
    .prose-cyber h1, .prose-cyber h2, .prose-cyber h3 { color: #38bdf8; font-weight: 700; margin-top: 0.4rem; margin-bottom: 0.25rem; }
    .prose-cyber h3 { font-size: 0.9rem; border-bottom: 1px solid rgba(56, 189, 248, 0.25); padding-bottom: 2px; }
    .prose-cyber p { margin-bottom: 0.45rem; line-height: 1.5; }
    .prose-cyber ul { list-style-type: disc; padding-left: 1.2rem; margin-bottom: 0.45rem; }
    .prose-cyber ol { list-style-type: decimal; padding-left: 1.2rem; margin-bottom: 0.45rem; }
    .prose-cyber li { margin-bottom: 0.2rem; }
    .prose-cyber code { background: rgba(15, 23, 42, 0.9); border: 1px solid rgba(255,255,255,0.12); padding: 1px 4px; border-radius: 4px; color: #a5f3fc; font-size: 0.85em; }
    .prose-cyber pre { background: rgba(15, 23, 42, 0.95); border: 1px solid rgba(255,255,255,0.12); padding: 8px; border-radius: 6px; overflow-x: auto; margin-bottom: 0.5rem; }
    .prose-cyber strong { color: #f8fafc; font-weight: 700; }
    @media print {
      body { background: #ffffff !important; color: #000000 !important; overflow: visible !important; }
      .no-print { display: none !important; }
      .print-only { display: block !important; }
      .glass-card { background: #ffffff !important; border: 1px solid #e2e8f0 !important; color: #0f172a !important; }
    }
  </style>
</head>
<body class="h-full flex flex-col">
  <div id="root" class="h-full flex flex-col"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;



    // --- Interactive Cytoscape Visualizer ---
    function GraphVisualizer({ graphData, activeTab, onNodeSelect, onEdgeSelect, selectedNodeId, selectedEdgeId, xaiFamilyFilter, highlightPathTarget }) {
      const containerRef = useRef(null);
      const cyRef = useRef(null);
      // Independent layout preferences: Network Map ALWAYS defaults to Clean Flow (dagre); Compliance Trace defaults to Organic (cose)
      const [networkLayout, setNetworkLayout] = useState('dagre');
      const [xaiLayout, setXaiLayout] = useState('cose');

      const currentLayoutName = activeTab === 'network' ? networkLayout : xaiLayout;
      const setCurrentLayoutName = (newLayout) => {
        if (activeTab === 'network') {
          setNetworkLayout(newLayout);
        } else {
          setXaiLayout(newLayout);
        }
      };

      useEffect(() => {
        if (!containerRef.current || !graphData) return;

        // Register dagre if available
        try {
          if (typeof cytoscape('core', 'dagre') === 'undefined' && typeof cytoscapeDagre !== 'undefined') {
            cytoscape.use(cytoscapeDagre);
          }
        } catch (e) {
          console.debug("Dagre registration:", e);
        }

        const isXAIView = activeTab === 'xai';
        let filteredNodes = graphData.nodes ? [...graphData.nodes] : [];
        let filteredEdges = graphData.edges ? [...graphData.edges] : [];

        // If XAI view has a family filter selected (not ALL), filter graph elements
        if (isXAIView && xaiFamilyFilter && xaiFamilyFilter !== 'ALL') {
          const allowedNodeIds = new Set(['Audit_Root', `Fam_${xaiFamilyFilter}`]);
          filteredNodes.forEach(n => {
            const id = n.data.id;
            if (id.startsWith(`Ctrl_${xaiFamilyFilter}`) || id.startsWith(`Obj_${xaiFamilyFilter}`)) {
              allowedNodeIds.add(id);
            }
          });
          filteredNodes = filteredNodes.filter(n => allowedNodeIds.has(n.data.id));
          filteredEdges = filteredEdges.filter(e => allowedNodeIds.has(e.data.source) && allowedNodeIds.has(e.data.target));
        }

        const elements = [];
        filteredNodes.forEach(n => elements.push({ group: 'nodes', data: n.data }));
        filteredEdges.forEach(e => elements.push({ group: 'edges', data: e.data }));

        // Choose layout configuration
        let layoutConfig = {
          name: 'dagre',
          rankDir: isXAIView ? 'LR' : 'TB',
          nodeSep: isXAIView ? 35 : 45,
          rankSep: isXAIView ? 75 : 65,
          edgeSep: 25,
          padding: 25,
          animate: true,
          animationDuration: 300
        };

        if (currentLayoutName === 'concentric') {
          layoutConfig = {
            name: 'concentric',
            concentric: function(node) {
              const t = node.data('type');
              if (t === 'firewall' || t === 'query') return 4;
              if (t === 'subnet' || t === 'family') return 3;
              if (t === 'server' || t === 'control') return 2;
              return 1;
            },
            levelWidth: function() { return 1; },
            padding: 30,
            animate: true
          };
        } else if (currentLayoutName === 'cose') {
          // Clean Organic Force-Directed Physics: properly scaled forces and randomized initial seeding
          layoutConfig = {
            name: 'cose',
            randomize: true,
            animate: true,
            animationDuration: 600,
            fit: true,
            padding: 35,
            componentSpacing: 100,
            nodeOverlap: 8,
            idealEdgeLength: function(edge) {
              const t = edge.data('type');
              if (t === 'INCLUDES_FAMILY') return 150; // Push 5 families well out from Root
              if (t === 'EVALUATES') return 80;        // Controls spread around family hub
              return 38;                               // Objectives orbit parent control
            },
            edgeElasticity: function(edge) {
              const t = edge.data('type');
              if (t === 'INCLUDES_FAMILY') return 64;
              if (t === 'EVALUATES') return 32;
              return 16;
            },
            nodeRepulsion: function(node) {
              const t = node.data('type');
              if (t === 'query') return 18432;         // Central root repels families outward
              if (t === 'family') return 12288;        // Family hubs repel each other strongly
              if (t === 'control') return 6144;        // Controls spread out comfortably
              return 2048;                             // Objective dots
            },
            gravity: 0.35,
            numIter: 1500,
            initialTemp: 1000,
            coolingFactor: 0.98,
            minTemp: 1.0
          };
        }

        const cy = cytoscape({
          container: containerRef.current,
          elements: elements,
          minZoom: 0.25,
          maxZoom: 1.15,
          style: [
            // Standard Leaf Node Style
            {
              selector: 'node',
              style: {
                'label': 'data(label)',
                'background-color': '#1e293b',
                'border-width': 2,
                'border-color': '#38bdf8',
                'color': '#f8fafc',
                'font-size': '10px',
                'font-family': 'Inter, sans-serif',
                'font-weight': 600,
                'text-valign': 'bottom',
                'text-margin-y': 5,
                'text-wrap': 'wrap',
                'text-max-width': '120px',
                'text-background-color': '#080c14',
                'text-background-opacity': 0.9,
                'text-background-padding': '2px',
                'text-background-shape': 'roundrectangle',
                'width': 38,
                'height': 38,
                'shape': 'roundrectangle',
                'transition-property': 'background-color, border-color, border-width, width, height',
                'transition-duration': '0.2s'
              }
            },
            // Subnet Parent Compound Grouping Style
            {
              selector: ':parent',
              style: {
                'background-color': '#0f172a',
                'background-opacity': 0.45,
                'border-width': 1.5,
                'border-color': '#0284c7',
                'border-style': 'dashed',
                'shape': 'roundrectangle',
                'padding': '18px',
                'text-valign': 'top',
                'text-halign': 'center',
                'text-margin-y': -6,
                'color': '#38bdf8',
                'font-size': '10px',
                'font-weight': 700,
                'font-family': 'Inter, sans-serif',
                'text-background-color': '#080c14',
                'text-background-opacity': 0.9,
                'text-background-padding': '2px',
                'text-background-shape': 'roundrectangle'
              }
            },
            // Node Classes with Native Vector Shapes (100% zero HTTP requests)
            {
              selector: 'node[type = "device"]',
              style: {
                'shape': 'round-rectangle',
                'background-color': '#0284c7',
                'border-color': '#38bdf8',
                'border-width': 2,
                'width': 38, 'height': 38
              }
            },
            {
              selector: 'node[type = "firewall"]',
              style: {
                'shape': 'octagon',
                'background-color': '#e11d48',
                'border-color': '#fb7185',
                'border-width': 2.5,
                'width': 44, 'height': 44
              }
            },
            {
              selector: 'node[type = "storage"]',
              style: {
                'shape': 'barrel',
                'background-color': '#d97706',
                'border-color': '#fbbf24',
                'border-width': 2,
                'width': 40, 'height': 40
              }
            },
            {
              selector: 'node[type = "server"]',
              style: {
                'shape': 'round-rectangle',
                'background-color': '#4f46e5',
                'border-color': '#818cf8',
                'border-width': 2,
                'width': 42, 'height': 42
              }
            },
            {
              selector: 'node[type = "cloud_service"]',
              style: {
                'shape': 'hexagon',
                'background-color': '#0891b2',
                'border-color': '#22d3ee',
                'border-width': 2,
                'width': 40, 'height': 40
              }
            },
            {
              selector: 'node[type = "data_asset"]',
              style: {
                'shape': 'rhomboid',
                'background-color': '#b45309',
                'border-color': '#fcd34d',
                'border-width': 2,
                'width': 36, 'height': 36
              }
            },
            // XAI Tree Specific Styles: Clean Hierarchical Constellation
            {
              selector: 'node[type = "query"]',
              style: {
                'shape': 'diamond',
                'background-color': '#047857',
                'border-color': '#34d399',
                'border-width': 3,
                'width': 52,
                'height': 52,
                'font-size': '11px',
                'font-weight': 800,
                'color': '#ecfdf5',
                'text-margin-y': 6,
                'text-background-color': '#064e3b',
                'text-background-opacity': 0.95,
                'text-background-padding': '3px',
                'text-background-shape': 'roundrectangle'
              }
            },
            {
              selector: 'node[type = "family"]',
              style: {
                'shape': 'round-hexagon',
                'background-color': '#6d28d9',
                'border-color': '#c084fc',
                'border-width': 2.5,
                'width': 44,
                'height': 44,
                'font-size': '10px',
                'font-weight': 700,
                'color': '#f5f3ff',
                'text-margin-y': 5,
                'text-background-color': '#4c1d95',
                'text-background-opacity': 0.95,
                'text-background-padding': '2px',
                'text-background-shape': 'roundrectangle'
              }
            },
            {
              selector: 'node[type = "control"]',
              style: {
                'shape': 'round-rectangle',
                'width': 34,
                'height': 34,
                'font-size': '9px',
                'font-weight': 700,
                'text-margin-y': 4,
                'text-max-width': '85px',
                'text-background-color': '#080c14',
                'text-background-opacity': 0.9,
                'text-background-padding': '2px',
                'text-background-shape': 'roundrectangle'
              }
            },
            // Objective satellite dots: clean constellation, suppressed labels by default to prevent clutter
            {
              selector: 'node[type = "objective"]',
              style: {
                'shape': 'ellipse',
                'width': 14,
                'height': 14,
                'border-width': 1.5,
                'border-color': '#64748b',
                'background-color': '#1e293b',
                'label': '', // Clean constellation: suppress text overlap
                'text-background-opacity': 0
              }
            },
            {
              selector: 'node[type = "objective"].hovered-node, node[type = "objective"]:selected, node[type = "objective"].path-highlight',
              style: {
                'label': 'data(label)',
                'font-size': '9px',
                'font-weight': 600,
                'color': '#a5f3fc',
                'text-background-color': '#080c14',
                'text-background-opacity': 0.95,
                'text-background-padding': '2px',
                'text-background-shape': 'roundrectangle',
                'width': 20,
                'height': 20,
                'border-width': 2.5,
                'border-color': '#22d3ee',
                'z-index': 999
              }
            },
            {
              selector: 'node[status = "MET"]',
              style: {
                'background-color': '#065f46',
                'border-color': '#10b981',
                'border-width': 2.5
              }
            },
            {
              selector: 'node[status = "UNMET"]',
              style: {
                'background-color': '#881337',
                'border-color': '#f43f5e',
                'border-width': 2.5
              }
            },
            {
              selector: 'node[status = "INSUFFICIENT_DATA"]',
              style: {
                'background-color': '#78350f',
                'border-color': '#f59e0b',
                'border-width': 2
              }
            },
            {
              selector: 'node[status = "PENDING_AUDIT"]',
              style: {
                'background-color': '#1e293b',
                'border-color': '#64748b',
                'border-width': 2
              }
            },
            {
              selector: 'node[status = "INFO"]',
              style: {
                'background-color': '#0f172a',
                'border-color': '#38bdf8',
                'border-width': 2.5
              }
            },
            // Edge Styles with clean hierarchy
            {
              selector: 'edge',
              style: {
                'width': 1.5,
                'line-color': '#475569',
                'target-arrow-color': '#475569',
                'target-arrow-shape': 'triangle',
                'curve-style': 'bezier',
                'font-size': '8px',
                'font-family': 'Inter, sans-serif',
                'color': '#94a3b8'
              }
            },
            {
              selector: 'edge[type = "DETERMINES"]',
              style: {
                'width': 1,
                'opacity': 0.35,
                'line-color': '#475569',
                'target-arrow-shape': 'none'
              }
            },
            {
              selector: 'edge[type = "EVALUATES"]',
              style: {
                'width': 1.8,
                'opacity': 0.65,
                'line-color': '#818cf8',
                'target-arrow-color': '#818cf8',
                'target-arrow-shape': 'triangle',
                'arrow-scale': 0.75
              }
            },
            {
              selector: 'edge[type = "INCLUDES_FAMILY"]',
              style: {
                'width': 2.5,
                'opacity': 0.85,
                'line-color': '#38bdf8',
                'target-arrow-color': '#38bdf8',
                'target-arrow-shape': 'triangle',
                'arrow-scale': 0.85
              }
            },
            {
              selector: 'edge[is_encrypted = true]',
              style: {
                'line-color': '#10b981',
                'target-arrow-color': '#10b981',
                'width': 2
              }
            },
            {
              selector: ':selected',
              style: {
                'border-width': 3.5,
                'border-color': '#38bdf8',
                'shadow-blur': 10,
                'shadow-color': '#0284c7',
                'shadow-opacity': 0.8
              }
            },
            {
              selector: 'edge:selected',
              style: {
                'width': 3.5,
                'line-color': '#38bdf8',
                'target-arrow-color': '#38bdf8',
                'color': '#38bdf8',
                'opacity': 1
              }
            },
            // Path Highlighting & Dimming Styles
            {
              selector: '.path-dimmed',
              style: {
                'opacity': 0.12,
                'text-opacity': 0.12
              }
            },
            {
              selector: 'node.path-highlight',
              style: {
                'border-width': 4,
                'border-color': '#38bdf8',
                'shadow-blur': 18,
                'shadow-color': '#0284c7',
                'shadow-opacity': 1,
                'opacity': 1,
                'text-opacity': 1,
                'z-index': 999
              }
            },
            {
              selector: 'edge.path-highlight',
              style: {
                'width': 4.5,
                'line-color': '#38bdf8',
                'target-arrow-color': '#38bdf8',
                'color': '#38bdf8',
                'opacity': 1,
                'text-opacity': 1,
                'shadow-blur': 14,
                'shadow-color': '#0284c7',
                'shadow-opacity': 0.95,
                'z-index': 998
              }
            }
          ],
          layout: layoutConfig
        });

        const fitGraphCleanly = (cyInstance) => {
          if (!cyInstance) return;
          const nodeCount = cyInstance.nodes().length;
          if (nodeCount === 0) return;
          if (nodeCount <= 2) {
            cyInstance.center();
            cyInstance.zoom(1.0); // Never over-zoom single or two devices
          } else {
            cyInstance.fit(null, 30);
            if (cyInstance.zoom() > 1.05) {
              cyInstance.zoom(1.0);
              cyInstance.center();
            }
          }
        };

        cy.on('tap', 'node', (evt) => {
          const nodeData = evt.target.data();
          if (onNodeSelect) onNodeSelect(nodeData);
        });

        cy.on('tap', 'edge', (evt) => {
          const edgeData = evt.target.data();
          if (onEdgeSelect) onEdgeSelect(edgeData);
        });

        // Hover over objective dots dynamically reveals their label without persistent clutter
        cy.on('mouseover', 'node[type = "objective"]', (evt) => {
          evt.target.addClass('hovered-node');
        });
        cy.on('mouseout', 'node[type = "objective"]', (evt) => {
          evt.target.removeClass('hovered-node');
        });

        // Tapping background clears path highlight & dimming
        cy.on('tap', (evt) => {
          if (evt.target === cy) {
            cy.elements().removeClass('path-dimmed path-highlight');
          }
        });

        cy.ready(() => {
          fitGraphCleanly(cy);
        });

        cyRef.current = cy;

        const handleResize = () => {
          if (cyRef.current) fitGraphCleanly(cyRef.current);
        };
        window.addEventListener('resize', handleResize);

        return () => {
          window.removeEventListener('resize', handleResize);
          cy.destroy();
        };
      }, [graphData, activeTab, currentLayoutName, xaiFamilyFilter]);

      // Handle Copilot Trace Link -> Organic Path Illumination (Strictly for AI Compliance Trace tab)
      useEffect(() => {
        if (activeTab !== 'xai' || !cyRef.current || !highlightPathTarget) return;
        const cy = cyRef.current;
        const targetId = highlightPathTarget.targetId;
        if (!targetId) return;

        // Force Organic Layout on Compliance Trace when tracing path
        if (xaiLayout !== 'cose') {
          setXaiLayout('cose');
        }

        const timer = setTimeout(() => {
          let targetNode = cy.$(`#Ctrl_${targetId}`);
          if (!targetNode.length) {
            targetNode = cy.$(`node[control_id = "${targetId}"]`);
          }
          if (!targetNode.length) {
            targetNode = cy.$(`node[id = "${targetId}"]`);
          }
          if (!targetNode.length) {
            targetNode = cy.nodes().filter(n => (n.data('id') || '').includes(targetId) || (n.data('control_id') || '').includes(targetId));
          }

          if (targetNode.length > 0) {
            const rootNode = cy.$('#Audit_Root');
            let pathElements = cy.collection();

            if (rootNode.length > 0) {
              const aStar = cy.elements().aStar({ root: rootNode, goal: targetNode.first(), directed: false });
              if (aStar.found) {
                pathElements = aStar.path;
              }
            }

            if (!pathElements.length) {
              pathElements = targetNode.first().closedNeighborhood();
            } else {
              // Also include direct determination objectives for the control
              pathElements = pathElements.union(targetNode.first().outgoers());
            }

            // Dim everything else and highlight path
            cy.elements().removeClass('path-highlight').addClass('path-dimmed');
            pathElements.removeClass('path-dimmed').addClass('path-highlight');
            targetNode.first().select();

            // Smoothly animate zoom & pan to the path
            cy.animate({
              fit: { eles: pathElements, padding: 60 },
              duration: 700,
              easing: 'ease-out-cubic'
            });
          }
        }, 200);

        return () => clearTimeout(timer);
      }, [highlightPathTarget, graphData]);

      const handleFit = () => {
        if (!cyRef.current) return;
        const nodeCount = cyRef.current.nodes().length;
        if (nodeCount <= 2) {
          cyRef.current.center();
          cyRef.current.zoom(1.0);
        } else {
          cyRef.current.fit(null, 30);
          if (cyRef.current.zoom() > 1.05) {
            cyRef.current.zoom(1.0);
            cyRef.current.center();
          }
        }
      };
      const handleZoomIn = () => cyRef.current && cyRef.current.zoom(cyRef.current.zoom() * 1.25);
      const handleZoomOut = () => cyRef.current && cyRef.current.zoom(cyRef.current.zoom() * 0.8);

      return (
        <div className="relative w-full h-full bg-slate-950/70 rounded-xl overflow-hidden border border-slate-800 flex flex-col">
          <div ref={containerRef} className="w-full flex-1" />
          
          {/* Top-Right Canvas Controls: Layout Switcher + Zoom */}
          <div className="absolute top-2.5 right-2.5 flex items-center gap-1 bg-slate-900/90 backdrop-blur border border-slate-700/80 rounded-lg p-1 shadow-lg z-10">
            <select
              value={currentLayoutName}
              onChange={(e) => setCurrentLayoutName(e.target.value)}
              className="bg-slate-800 text-slate-200 text-[11px] font-semibold px-2 py-0.5 rounded border border-slate-700 focus:outline-none cursor-pointer"
              title="Change Graph Layout"
            >
              {activeTab === 'network' ? (
                <React.Fragment>
                  <option value="dagre">Clean Flow (Hierarchical)</option>
                  <option value="concentric">Concentric Rings</option>
                  <option value="cose">Organic (Force-Directed)</option>
                </React.Fragment>
              ) : (
                <React.Fragment>
                  <option value="cose">Organic (Force-Directed)</option>
                  <option value="dagre">Clean Flow (Hierarchical)</option>
                  <option value="concentric">Concentric Rings</option>
                </React.Fragment>
              )}
            </select>

            <button onClick={handleFit} className="px-2 py-0.5 text-[11px] text-slate-300 hover:text-white hover:bg-slate-800 rounded transition font-medium" title="Auto-Fit">Auto-Fit</button>
            <button onClick={handleZoomIn} className="w-6 h-6 flex items-center justify-center text-xs text-slate-300 hover:text-white hover:bg-slate-800 rounded transition font-bold" title="Zoom In">+</button>
            <button onClick={handleZoomOut} className="w-6 h-6 flex items-center justify-center text-xs text-slate-300 hover:text-white hover:bg-slate-800 rounded transition font-bold" title="Zoom Out">-</button>
          </div>

          {/* Bottom-Left Legend */}
          <div className="absolute bottom-2.5 left-2.5 bg-slate-900/85 backdrop-blur border border-slate-800 rounded-lg px-2.5 py-1 text-[10px] text-slate-300 flex items-center gap-3">
            <span className="flex items-center gap-1.5"><span className="w-2 h-2 rounded-full bg-emerald-400"></span> Confirmed / Met</span>
            <span className="flex items-center gap-1.5"><span className="w-2 h-2 rounded-full bg-amber-400"></span> Needs Info</span>
            <span className="flex items-center gap-1.5"><span className="w-2 h-2 rounded-full bg-rose-400"></span> Unmet Gap</span>
          </div>
        </div>
      );
    }

    // --- Main App Component ---
    function App() {
      const [templates, setTemplates] = useState([]);
      const [selectedTemplate, setSelectedTemplate] = useState("clinic");
      const [topologyResult, setTopologyResult] = useState(null);
      const [auditResult, setAuditResult] = useState(null);
      const [baselineComplianceGraph, setBaselineComplianceGraph] = useState(null);
      const [baselineFamilyScores, setBaselineFamilyScores] = useState([]);
      const [selectedNode, setSelectedNode] = useState(null);
      const [selectedComplianceItem, setSelectedComplianceItem] = useState(null);
      const [activeCanvasTab, setActiveCanvasTab] = useState("network"); // "network" | "xai"
      const [selectedFamilyFilter, setSelectedFamilyFilter] = useState("ALL");
      const [highlightPathTarget, setHighlightPathTarget] = useState(null); // { targetId: string, timestamp: number }
      const [promptText, setPromptText] = useState("");
      const [loading, setLoading] = useState(false);
      const [auditPending, setAuditPending] = useState(true); // Flag indicating audit is needed
      const [notification, setNotification] = useState(null);
      const [showReportModal, setShowReportModal] = useState(false);
      const [reportOrgName, setReportOrgName] = useState("St. Jude Community Health Clinic");
      const [showAddDeviceModal, setShowAddDeviceModal] = useState(false);
      const [newDeviceType, setNewDeviceType] = useState("device");
      const [newDeviceName, setNewDeviceName] = useState("");
      const [newDeviceSubnet, setNewDeviceSubnet] = useState("");
      
      // Cyber Clinic Copilot Conversational State
      const [copilotMessages, setCopilotMessages] = useState([
        {
          role: "assistant",
          content: "### Welcome to GaRC Cyber Clinic Copilot!\n\nI'm your guided cybersecurity and **NIST SP 800-171 Rev 3** compliance assistant.\n\n- **Ask compliance questions**: *'What is CUI?'*, *'How do we enforce MFA?'*, or *'How can we segment guest Wi-Fi?'*\n- **Describe your computers & gear**: *'We have 5 laptops and a Synology NAS with client contracts'*\n- **Trace directly to CPRT**: Every control and node discussed links directly into the Knowledge Graph below!",
          kg_traces: [
            { id: "03.01.01", label: "03.01.01 Access Control", type: "control", family: "03.01", status: "ACTIVE" },
            { id: "03.05.03", label: "03.05.03 Multi-Factor Auth", type: "control", family: "03.05", status: "ACTIVE" },
            { id: "03.13.01", label: "03.13.01 Boundary Protection", type: "control", family: "03.13", status: "ACTIVE" }
          ]
        }
      ]);
      const [copilotInput, setCopilotInput] = useState("");
      const [copilotLoading, setCopilotLoading] = useState(false);
      const [copilotFollowups, setCopilotFollowups] = useState([
        "What is CUI and does my company have it?",
        "We have 4 Windows PCs and a Synology NAS with patient records",
        "How do I isolate Guest Wi-Fi from our office data?"
      ]);

      // Jump to Node or Control from KG Trace link
      const handleTraceClick = (trace) => {
        if (!trace) return;
        if (trace.type === "node") {
          setActiveCanvasTab("network");
          setHighlightPathTarget(null);
          const foundNode = topologyResult?.nodes?.find(n => n.id === trace.id || n.name?.toLowerCase() === trace.label?.toLowerCase());
          if (foundNode) {
            setSelectedNode(foundNode);
            showToast(`Focused on Asset: ${foundNode.name}`);
          } else {
            showToast(`Asset: ${trace.label || trace.id}`);
          }
        } else if (trace.type === "control") {
          setActiveCanvasTab("xai");
          if (trace.family) {
            setSelectedFamilyFilter(trace.family);
          }
          const ctrlId = trace.id;
          const ctrlData = auditResult?.evaluated_controls?.find(c => c.control_id === ctrlId || c.control_id?.endsWith(ctrlId));
          if (ctrlData) {
            setSelectedComplianceItem({ kind: "node", type: "control", ...ctrlData });
          } else {
            setSelectedComplianceItem({
              kind: "node",
              type: "control",
              control_id: ctrlId,
              title: trace.label || `NIST ${ctrlId}`,
              status: trace.status || "ACTIVE",
              description: `NIST SP 800-171 Rev 3 requirement for ${ctrlId}.`
            });
          }
          // Highlight full path from Root -> Family -> Control in Organic layout
          setHighlightPathTarget({ targetId: ctrlId, timestamp: Date.now() });
          showToast(`Traced Organic Path: Root ➔ Family ➔ NIST ${trace.id}`);
        }
      };

      // Quick question to Copilot about a specific control
      const handleAskCopilotAboutControl = (ctrl) => {
        if (!ctrl) return;
        const cid = ctrl.control_id || ctrl.id?.replace('Ctrl_', '') || 'this control';
        const title = ctrl.title || '';
        setActiveCanvasTab("copilot");
        setCopilotInput(`What are the specific requirements for NIST ${cid} (${title}) and how do we satisfy it?`);
      };

      // Interactive What-If Remediation Sandbox State
      const [activeWhatIfFixes, setActiveWhatIfFixes] = useState([]);
      const [simulationDelta, setSimulationDelta] = useState(null);


      // Notify helper
      const showToast = (msg, type = "success") => {
        setNotification({ msg, type });
        setTimeout(() => setNotification(null), 3000);
      };

      // Load initial templates and pre-load baseline CPRT Knowledge Graph
      useEffect(() => {
        fetch("/api/templates")
          .then(res => res.json())
          .then(data => {
            setTemplates(data);
            handleLoadTemplate("clinic", false);
          })
          .catch(err => {
            console.error("Failed to load templates:", err);
            handleLoadTemplate("clinic", false);
          });

        // Immediately fetch static baseline CPRT Knowledge Graph
        fetch("/api/compliance/baseline-graph")
          .then(res => res.json())
          .then(data => {
            if (data && data.cytoscape_graph) {
              setBaselineComplianceGraph(data.cytoscape_graph);
              if (data.family_scorecards) {
                setBaselineFamilyScores(data.family_scorecards);
              }
            }
          })
          .catch(err => console.debug("Baseline compliance graph fetch error:", err));
      }, []);

      // Load template action (with option to run audit)
      const handleLoadTemplate = async (templateId, runAuditImmediately = false) => {
        setLoading(true);
        setSelectedTemplate(templateId);
        try {
          const res = await fetch(`/api/templates/load/${templateId}`, { method: "POST" });
          const topo = await res.json();
          setTopologyResult(topo);
          setSelectedNode(null);
          setAuditPending(true);
          if (runAuditImmediately) {
            await handleRunAudit();
          }
          showToast(`Loaded ${templateId.toUpperCase()} template! Click 'Run Audit' when ready.`);
        } catch (e) {
          console.error(e);
        } finally {
          setLoading(false);
        }
      };

      // Clear Workspace (Empty Canvas)
      const handleClearWorkspace = async () => {
        setLoading(true);
        setSelectedTemplate("custom");
        try {
          const res = await fetch("/api/topology/clear", { method: "POST" });
          const topo = await res.json();
          setTopologyResult(topo);
          setSelectedNode(null);
          setAuditResult(null);
          setAuditPending(false);
          showToast("Workspace cleared. Ready for custom setup!");
        } catch (e) {
          console.error(e);
        } finally {
          setLoading(false);
        }
      };

      // Explicit User-Triggered Compliance Audit
      const handleRunAudit = async () => {
        setLoading(true);
        try {
          const res = await fetch("/api/audit/evaluate-topology", { method: "POST" });
          const audit = await res.json();
          setAuditResult(audit);
          setAuditPending(false);
          showToast("NIST SP 800-171 Audit Completed!");
        } catch (e) {
          console.error("Audit error:", e);
          showToast("Audit evaluation failed.", "error");
        } finally {
          setLoading(false);
        }
      };

      // Natural language prompt parsing
      const handleParsePrompt = async (e) => {
        e?.preventDefault();
        if (!promptText.trim()) return;
        setLoading(true);
        try {
          const res = await fetch("/api/engine2/parse-topology", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ text: promptText })
          });
          const topo = await res.json();
          setTopologyResult(topo);
          setSelectedNode(null);
          setSelectedTemplate("custom");
          setAuditPending(true);
          showToast("Network topology built! Click 'Run Audit' to evaluate.");
        } catch (e) {
          console.error(e);
          showToast("Failed to parse network prompt", "error");
        } finally {
          setLoading(false);
        }
      };

      // Resolve a clarification question
      const handleAnswerClarification = async (nodeId, propName, answerValue) => {
        setLoading(true);
        try {
          const res = await fetch("/api/topology/answer-clarification", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              node_id: nodeId,
              property_name: propName,
              value: answerValue
            })
          });
          const topo = await res.json();
          setTopologyResult(topo);
          setAuditPending(true);
          showToast("Clarification saved. Click 'Run Audit' to re-score.");
        } catch (e) {
          console.error(e);
        } finally {
          setLoading(false);
        }
      };

      // Toggle node attributes directly (CUI, MFA, Encryption)
      const handleToggleNodeProp = async (nodeId, propName, currentValue) => {
        setLoading(true);
        try {
          const res = await fetch("/api/topology/update-node", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              node_id: nodeId,
              updates: { [propName]: !currentValue }
            })
          });
          const topo = await res.json();
          setTopologyResult(topo);
          if (selectedNode && selectedNode.id === nodeId) {
            setSelectedNode({ ...selectedNode, [propName]: !currentValue });
          }
          setAuditPending(true);
          showToast(`Updated ${propName}! Click 'Run Audit' to re-score.`);
        } catch (e) {
          console.error(e);
        } finally {
          setLoading(false);
        }
      };

      // Assign node to a subnet
      const handleAssignSubnet = async (nodeId, targetSubnetId) => {
        setLoading(true);
        try {
          const res = await fetch("/api/topology/update-node", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              node_id: nodeId,
              updates: { subnet_id: targetSubnetId }
            })
          });
          const topo = await res.json();
          setTopologyResult(topo);
          if (selectedNode && selectedNode.id === nodeId) {
            setSelectedNode({ ...selectedNode, parent: targetSubnetId });
          }
          setAuditPending(true);
          showToast(`Device moved to subnet!`);
        } catch (e) {
          console.error(e);
        } finally {
          setLoading(false);
        }
      };

      // Delete Node
      const handleDeleteNode = async (nodeId) => {
        setLoading(true);
        try {
          const res = await fetch("/api/topology/delete-node", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ node_id: nodeId })
          });
          const topo = await res.json();
          setTopologyResult(topo);
          setSelectedNode(null);
          setAuditPending(true);
          showToast("Device deleted. Click 'Run Audit' to re-score.");
        } catch (e) {
          console.error(e);
        } finally {
          setLoading(false);
        }
      };

      // Add New Device from Palette
      const handleAddDevice = async () => {
        if (!newDeviceName.trim()) return;
        setLoading(true);
        const newId = "dev_" + Date.now().toString().slice(-4);
        try {
          const res = await fetch("/api/topology/add-node", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              id: newId,
              name: newDeviceName.trim(),
              type: newDeviceType,
              ip_or_subnet: "192.168.1.x",
              os_or_system: "Standard OS",
              stores_cui: false,
              has_firewall_or_mfa: false,
              subnet_id: newDeviceSubnet || undefined
            })
          });
          const topo = await res.json();
          setTopologyResult(topo);
          setShowAddDeviceModal(false);
          setNewDeviceName("");
          setNewDeviceSubnet("");
          setAuditPending(true);
          showToast(`Added ${newDeviceName}! Click 'Run Audit' to evaluate.`);
        } catch (e) {
          console.error(e);
        } finally {
          setLoading(false);
        }
      };

      // Send message to Cyber Clinic Copilot
      const handleSendCopilotMessage = async (msgToSend) => {
        const text = msgToSend || copilotInput;
        if (!text.trim() || copilotLoading) return;

        const newHistory = [...copilotMessages, { role: "user", content: text }];
        setCopilotMessages(newHistory);
        setCopilotInput("");
        setCopilotLoading(true);

        try {
          const res = await fetch("/api/chat/copilot", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              message: text,
              history: newHistory.slice(-6)
            })
          });
          const data = await res.json();
          setCopilotMessages(prev => [...prev, {
            role: "assistant",
            content: data.reply,
            actions_taken: data.actions_taken,
            kg_traces: data.kg_traces || []
          }]);
          if (data.suggested_followups && data.suggested_followups.length > 0) {
            setCopilotFollowups(data.suggested_followups);
          }
          if (data.topology_updated && data.topology) {
            setTopologyResult(data.topology);
            setAuditPending(true);
            showToast("Network topology updated from Copilot!");
          }
        } catch (e) {
          console.error(e);
          setCopilotMessages(prev => [...prev, {
            role: "assistant",
            content: "⚠️ I encountered an error communicating with the Copilot engine. Please try again."
          }]);
        } finally {
          setCopilotLoading(false);
        }
      };

      // What-If Simulation Sandbox Handlers
      const handleSimulateWhatIf = async (fixType) => {
        setLoading(true);
        try {
          const res = await fetch("/api/sandbox/simulate-fix", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ fix_type: fixType })
          });
          const data = await res.json();
          if (data.success) {
            setTopologyResult(data.topology);
            setAuditResult(data.audit_result);
            setActiveWhatIfFixes(data.active_fixes || []);
            setSimulationDelta(data.score_delta);
            setAuditPending(false);
            showToast(`Simulated: ${data.fix_title} (+${data.score_delta}% Readiness Gain!)`, "success");
          }
        } catch (e) {
          console.error(e);
          showToast("What-If simulation failed.", "error");
        } finally {
          setLoading(false);
        }
      };

      const handleRevertWhatIf = async () => {
        setLoading(true);
        try {
          const res = await fetch("/api/sandbox/revert-fix", { method: "POST" });
          const data = await res.json();
          if (data.success) {
            setTopologyResult(data.topology);
            setAuditResult(data.audit_result);
            setActiveWhatIfFixes([]);
            setSimulationDelta(null);
            setAuditPending(false);
            showToast("Reverted simulations to baseline topology.");
          }
        } catch (e) {
          console.error(e);
        } finally {
          setLoading(false);
        }
      };

      // Compute graph data for Cytoscape depending on active tab
      const currentGraphData = activeCanvasTab === "network" 
        ? topologyResult?.cytoscape_graph 
        : (auditResult?.cytoscape_graph || baselineComplianceGraph);

      // Extract all active subnets for assignment dropdown
      const activeSubnets = topologyResult?.nodes?.filter(n => n.type === "subnet") || [];

      return (
        <div className="h-full flex flex-col overflow-hidden">
          {/* --- Notification Toast --- */}
          {notification && (
            <div className="fixed top-3 right-3 z-50 flex items-center gap-2 px-3.5 py-2 rounded-lg shadow-xl text-xs font-semibold bg-emerald-600 text-white animate-fade-in">
              <span>{notification.msg}</span>
            </div>
          )}

          {/* --- Header Banner --- */}
          <header className="h-13 min-h-[52px] border-b border-slate-800 bg-slate-950/90 backdrop-blur px-4 py-2 flex items-center justify-between shrink-0">
            <div className="flex items-center gap-3">
              <div className="w-8 h-8 rounded-lg bg-gradient-to-tr from-cyan-600 to-emerald-500 flex items-center justify-center font-black text-sm text-white shadow-md shadow-cyan-900/30">
                G
              </div>
              <div className="flex items-center gap-2">
                <h1 className="font-bold text-sm text-slate-100 tracking-tight">GaRC</h1>
                <span className="text-[9px] uppercase font-bold tracking-wider px-1.5 py-0.5 rounded bg-cyan-950 text-cyan-400 border border-cyan-800/60">
                  NIST SP 800-171 Rev 3
                </span>
                <span className="text-[9px] uppercase font-semibold px-1.5 py-0.5 rounded bg-emerald-950 text-emerald-400 border border-emerald-800/60">
                  Fast In-Memory
                </span>
              </div>
            </div>

            {/* Quick Actions & Export */}
            <div className="flex items-center gap-2">
              <button
                onClick={handleClearWorkspace}
                className="px-2.5 py-1 text-xs font-medium text-slate-400 hover:text-white bg-slate-900 hover:bg-slate-800 rounded-md border border-slate-800 transition"
                title="Start from a blank canvas"
              >
                Clear Workspace
              </button>

              <button
                onClick={() => setShowReportModal(true)}
                className="flex items-center gap-1.5 bg-gradient-to-r from-cyan-600 to-emerald-600 hover:from-cyan-500 hover:to-emerald-500 text-white text-xs font-semibold px-3 py-1 rounded-md shadow transition"
              >
                Export Report
              </button>
            </div>
          </header>

          {/* --- Main 3-Column Compact Responsive Layout --- */}
          <main className="flex-1 overflow-hidden grid grid-cols-1 lg:grid-cols-12 gap-3 p-3 w-full">
            
            {/* ============================================================ */}
            {/* LEFT COLUMN: Presets, Palette & Device Inspector (3 cols) */}
            {/* ============================================================ */}
            <section className="lg:col-span-3 h-full overflow-y-auto custom-scroll flex flex-col gap-3 pr-1">
              
              {/* ========================================================================= */}
              {/* MODE A: COMPLIANCE KNOWLEDGE & DEFINITION INSPECTOR (When in XAI Trace)   */}
              {/* ========================================================================= */}
              {activeCanvasTab === "xai" ? (
                <div className="flex flex-col gap-3 h-full">
                  {/* Top Header Card */}
                  <div className="glass-card rounded-xl p-3 shadow-sm shrink-0 border-purple-800/60 bg-gradient-to-br from-slate-900 via-slate-900 to-purple-950/40">
                    <div className="flex items-center justify-between mb-1.5">
                      <div className="flex items-center gap-1.5">
                        <span className="w-2 h-2 rounded-full bg-purple-400 animate-pulse"></span>
                        <h2 className="text-[11px] font-bold uppercase tracking-wider text-purple-300">
                          Compliance Inspector
                        </h2>
                      </div>
                      <span className="text-[9px] font-mono px-1.5 py-0.5 rounded bg-purple-950 text-purple-300 border border-purple-800/80">
                        NIST SP 800-171 Rev 3
                      </span>
                    </div>
                    <p className="text-[11px] text-slate-300 leading-snug">
                      CPRT Knowledge Graph definition engine. Click any requirement, family, objective, or relationship edge on the graph to define its standard.
                    </p>
                  </div>

                  {/* Active Selected Node / Edge Definition Card */}
                  {selectedComplianceItem ? (
                    <div className="glass-card rounded-xl p-3 border-purple-800/70 bg-slate-900/90 shadow-md shrink-0 space-y-3 animate-fade-in">
                      
                      {/* 1. If Control Node */}
                      {(selectedComplianceItem.type === "control" || selectedComplianceItem.control_id || selectedComplianceItem.control_code || selectedComplianceItem.id?.startsWith('Ctrl_')) && (() => {
                        const ctrlDisplayId = selectedComplianceItem.control_id || selectedComplianceItem.control_code || selectedComplianceItem.id?.replace('Ctrl_', '') || selectedComplianceItem.label?.match(/\d{2}\.\d{2}\.\d{2}/)?.[0] || '03.01.01';
                        const displayTitle = selectedComplianceItem.title || (ctrlDisplayId ? `NIST SP 800-171 Control ${ctrlDisplayId}` : 'Requirement Details');
                        const displayDesc = selectedComplianceItem.formal_requirement || selectedComplianceItem.description || "Safeguard controlled unclassified information in nonfederal systems and organizations in accordance with NIST SP 800-171 Rev 3.";
                        const displayGuidance = selectedComplianceItem.guidance || selectedComplianceItem.assessor_guidance || selectedComplianceItem.action_for_assessor;
                        const displayObjs = selectedComplianceItem.objectives || selectedComplianceItem.determination_objectives || [];
                        const displayFinding = selectedComplianceItem.finding || selectedComplianceItem.findings;

                        return (
                          <div>
                            <div className="flex items-start justify-between gap-2 mb-2 pb-2 border-b border-slate-800">
                              <div>
                                <div className="flex items-center gap-1.5 mb-1 flex-wrap">
                                  <span className="px-2 py-0.5 rounded text-[10px] font-mono font-bold bg-cyan-950 text-cyan-300 border border-cyan-800">
                                    NIST {ctrlDisplayId}
                                  </span>
                                  <span className={`px-2 py-0.5 rounded text-[10px] font-bold ${
                                    selectedComplianceItem.status === 'MET' ? 'bg-emerald-950 text-emerald-300 border border-emerald-800' :
                                    selectedComplianceItem.status === 'UNMET' ? 'bg-rose-950 text-rose-300 border border-rose-800' :
                                    'bg-amber-950 text-amber-300 border border-amber-800'
                                  }`}>
                                    {selectedComplianceItem.status || 'EVALUATED'}
                                  </span>
                                </div>
                                <h3 className="text-xs font-bold text-slate-100 leading-snug">
                                  {displayTitle}
                                </h3>
                                {(selectedComplianceItem.family_name || selectedComplianceItem.family_code) && (
                                  <span className="text-[10px] text-purple-400 font-medium block mt-0.5">
                                    Family: {selectedComplianceItem.family_name || ''} {selectedComplianceItem.family_code ? `(${selectedComplianceItem.family_code})` : ''}
                                  </span>
                                )}
                              </div>
                            </div>

                            {/* Formal Requirement Definition */}
                            <div className="mb-2.5">
                              <span className="text-[10px] font-bold text-slate-400 uppercase tracking-wider block mb-1">
                                📖 Formal Requirement Definition:
                              </span>
                              <div className="p-2.5 rounded-lg bg-slate-950/80 border border-slate-800 text-[11px] text-slate-200 leading-relaxed font-sans">
                                {displayDesc}
                              </div>
                            </div>

                            {/* Audit Finding / Evidence */}
                            {displayFinding && (
                              <div className="mb-2.5">
                                <span className="text-[10px] font-bold text-slate-400 uppercase tracking-wider block mb-1">
                                  🔍 Active Topology Finding:
                                </span>
                                <div className={`p-2.5 rounded-lg border text-[11px] leading-relaxed font-sans ${
                                  selectedComplianceItem.status === 'MET' ? 'bg-emerald-950/30 border-emerald-800/70 text-emerald-200' :
                                  selectedComplianceItem.status === 'UNMET' ? 'bg-rose-950/30 border-rose-800/70 text-rose-200' :
                                  'bg-amber-950/30 border-amber-800/70 text-amber-200'
                                }`}>
                                  {displayFinding}
                                </div>
                              </div>
                            )}

                            {/* Assessor Guidance */}
                            {displayGuidance && (
                              <div className="mb-2.5">
                                <span className="text-[10px] font-bold text-slate-400 uppercase tracking-wider block mb-1">

                  </div>

                  <div className="space-y-2">
                    {auditResult.top_fixes.map((fix, idx) => (
                      <div key={idx} className="p-2.5 rounded-lg bg-slate-900/80 border border-slate-800 flex flex-col gap-1">
                        <div className="flex items-center justify-between">
                          <span className="text-[9px] uppercase font-bold tracking-wider px-1.5 py-0.5 rounded bg-emerald-950 text-emerald-300 border border-emerald-800/60">
                            {fix.impact}
                          </span>
                          <span className="text-[9px] text-slate-400">{fix.effort}</span>
                        </div>
                        <h4 className="text-xs font-bold text-slate-100">{fix.title}</h4>
                        <p className="text-[10px] text-slate-300 leading-snug">{fix.description}</p>
                        
                        <ul className="text-[10px] text-slate-400 space-y-0.5 pt-1 list-disc list-inside">
                          {fix.plain_english_steps?.map((step, sIdx) => (
                            <li key={sIdx} className="leading-snug">{step}</li>
                          ))}
                        </ul>

                        {/* 1-Click What-If Simulation Trigger */}
                        <div className="flex items-center justify-between pt-1.5 border-t border-slate-800/60 mt-1">
                          <button
                            onClick={() => handleSimulateWhatIf(fix.what_if_type || 'ENFORCE_MFA')}
                            disabled={loading}
                            className="px-2.5 py-1 rounded bg-gradient-to-r from-emerald-600 to-cyan-600 hover:from-emerald-500 hover:to-cyan-500 text-white text-[10px] font-bold shadow transition flex items-center gap-1"
                          >
                            <span>⚡ Simulate Fix (+Score Boost)</span>
                          </button>
                          {activeWhatIfFixes.includes(fix.what_if_type) && (
                            <span className="text-[10px] text-emerald-400 font-bold flex items-center gap-1">
                              ✓ Simulated
                            </span>
                          )}
                        </div>
                      </div>
                    ))}
                  </div>
                </div>
              )}


            </section>

          </main>

          {/* ============================================================ */}
          {/* MODAL 1: Add New Device Modal (with Subnet Assignment) */}
          {/* ============================================================ */}
          {showAddDeviceModal && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/70 backdrop-blur-sm">
              <div className="glass-card rounded-xl max-w-sm w-full p-4 border-slate-700 shadow-2xl">
                <h3 className="text-sm font-bold text-slate-100 mb-2.5">
                  Add New Device
                </h3>
                <div className="space-y-2.5">
                  <div>
                    <label className="text-xs text-slate-400 block mb-1">Device Name</label>
                    <input
                      type="text"
                      value={newDeviceName}
                      onChange={(e) => setNewDeviceName(e.target.value)}
                      placeholder="e.g. Accounting PC, Backup Server"
                      className="w-full text-xs p-2 rounded-lg bg-slate-950 border border-slate-800 text-slate-200 focus:outline-none focus:border-cyan-500"
                    />
                  </div>
                  <div>
                    <label className="text-xs text-slate-400 block mb-1">Device Type</label>
                    <select
                      value={newDeviceType}
                      onChange={(e) => setNewDeviceType(e.target.value)}
                      className="w-full text-xs p-2 rounded-lg bg-slate-950 border border-slate-800 text-slate-200 focus:outline-none focus:border-cyan-500"
                    >
                      <option value="device">Workstation / Laptop</option>
                      <option value="firewall">Firewall / Gateway</option>
                      <option value="storage">Storage / NAS</option>
                      <option value="server">Application Server</option>
                      <option value="cloud_service">Cloud SaaS / VPN</option>
                      <option value="subnet">Subnet / VLAN</option>
                    </select>
                  </div>

                  {newDeviceType !== "subnet" && activeSubnets.length > 0 && (
                    <div>
                      <label className="text-xs text-slate-400 block mb-1">Assign to Subnet / VLAN Container:</label>
                      <select
                        value={newDeviceSubnet}
                        onChange={(e) => setNewDeviceSubnet(e.target.value)}
                        className="w-full text-xs p-2 rounded-lg bg-slate-950 border border-slate-800 text-slate-200 focus:outline-none focus:border-cyan-500"
                      >
                        <option value="">(None / Direct Boundary)</option>
                        {activeSubnets.map(sub => (
                          <option key={sub.id} value={sub.id}>{sub.name}</option>
                        ))}
                      </select>
                    </div>
                  )}

                  <div className="flex items-center justify-end gap-2 pt-1">
                    <button
                      onClick={() => setShowAddDeviceModal(false)}
                      className="px-3 py-1 text-xs text-slate-400 hover:text-white"
                    >
                      Cancel
                    </button>
                    <button
                      onClick={handleAddDevice}
                      className="px-3.5 py-1.5 bg-cyan-600 hover:bg-cyan-500 text-white text-xs font-semibold rounded-lg shadow"
                    >
                      Add to Map
                    </button>
                  </div>
                </div>
              </div>
            </div>
          )}

          {/* ============================================================ */}
          {/* MODAL 2: 1-Click Executive Report Modal & Print View */}
          {/* ============================================================ */}
          {showReportModal && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-md overflow-y-auto">
              <div className="glass-card rounded-2xl max-w-3xl w-full p-6 lg:p-8 border-slate-700 shadow-2xl my-8 text-slate-200 flex flex-col gap-4">
                
                {/* Header with Print Button */}
                <div className="flex items-center justify-between border-b border-slate-800 pb-3">
                  <div>
                    <span className="text-[10px] uppercase font-bold tracking-widest text-cyan-400">Cyber Clinic Compliance Assessment</span>
                    <h2 className="text-lg font-black text-white tracking-tight">Executive Compliance & Action Report</h2>
                  </div>
                  <div className="flex items-center gap-2">
                    <button
                      onClick={() => window.print()}
                      className="px-3 py-1 bg-cyan-600 hover:bg-cyan-500 text-white text-xs font-semibold rounded-lg shadow"
                    >
                      Print / Save PDF
                    </button>
                    <button
                      onClick={() => setShowReportModal(false)}
                      className="w-7 h-7 flex items-center justify-center text-slate-400 hover:text-white rounded-lg bg-slate-800"
                    >
                      ✕
                    </button>
                  </div>
                </div>

                {/* Organization Details */}
                <div className="grid grid-cols-2 gap-3 p-3 rounded-xl bg-slate-900/80 border border-slate-800 text-xs">
                  <div>
                    <span className="text-slate-400 block mb-0.5">Assessed Organization</span>
                    <input
                      type="text"
                      value={reportOrgName}
                      onChange={(e) => setReportOrgName(e.target.value)}
                      className="bg-slate-950 font-semibold text-slate-100 p-1.5 rounded border border-slate-800 w-full"
                    />
                  </div>
                  <div>
                    <span className="text-slate-400 block mb-0.5">Standard & Version</span>
                    <span className="font-semibold text-slate-100 block pt-1.5">NIST SP 800-171 Rev 3 (5 Technical Families)</span>
                  </div>
                </div>

                {/* Executive Summary Score Banner */}
                <div className="p-3.5 rounded-xl bg-gradient-to-r from-slate-900 to-cyan-950/40 border border-cyan-800/40 flex items-center justify-between">
                  <div>
                    <span className="text-xs font-bold uppercase tracking-wider text-cyan-400">Overall Readiness Score</span>
                    <div className="text-2xl font-black text-white">{auditResult?.overall_score_pct || 0}%</div>
                  </div>
                  <div className="text-right text-xs">
                    <span className="text-emerald-400 font-bold block">{auditResult?.met_count || 0} Controls Met</span>
                    <span className="text-rose-400 font-bold block">{auditResult?.unmet_count || 0} Priority Gaps</span>
                    <span className="text-amber-400 font-bold block">{auditResult?.insufficient_data_count || 0} Need Clarification</span>
                  </div>
                </div>

                {/* High Priority Remediation Steps */}
                <div>
                  <h3 className="text-xs font-bold uppercase tracking-wider text-emerald-400 mb-2">
                    Top 3 High-Impact Action Items for Small Business
                  </h3>
                  <div className="space-y-1.5">
                    {auditResult?.top_fixes?.map((fix, idx) => (
                      <div key={idx} className="p-2.5 rounded-lg bg-slate-900/80 border border-slate-800 text-xs">
                        <div className="flex items-center justify-between mb-1">
                          <span className="font-bold text-slate-100">{idx+1}. {fix.title}</span>
                          <span className="text-[9px] text-emerald-400 font-semibold">{fix.impact}</span>
                        </div>
                        <p className="text-slate-300 mb-1.5">{fix.description}</p>
                        <ul className="text-slate-400 list-disc list-inside space-y-0.5 text-[11px]">
                          {fix.plain_english_steps?.map((step, sIdx) => (
                            <li key={sIdx}>{step}</li>
                          ))}
                        </ul>
                      </div>
                    ))}
                  </div>
                </div>

              </div>
            </div>
          )}

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
